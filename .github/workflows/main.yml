name: Build APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download Gradle (retry on network errors)
        run: |
          for i in 1 2 3 4 5 6; do
            ./gradlew --version && exit 0
            echo "Gradle download failed (attempt $i), retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apkextractor-release
          path: app/build/outputs/apk/**/*.apk
          
